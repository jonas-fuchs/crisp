name: Validate Customizations

on:
  push:
    paths:
      - 'agents/**'
      - 'skills/**'
      - 'instructions/**'
      - 'prompts/**'
      - 'templates/**'
      - 'scripts/validate_customizations.py'
      - 'scripts/install.sh'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'agents/**'
      - 'skills/**'
      - 'instructions/**'
      - 'prompts/**'
      - 'templates/**'
      - 'scripts/validate_customizations.py'
      - 'scripts/install.sh'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate customizations
        run: python3 scripts/validate_customizations.py

      - name: Dry-run installer
        run: bash scripts/install.sh --dry-run
